platform: openrouter-chess
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - cohere/north-mini-code:free
    - google/gemma-4-26b-a4b-it:free
  temperature: 0
  max_tokens: 1024

bindings:
  board.observe:
    native: stub.board_observe
  board.move:
    native: stub.board_move
  game.claim:
    native: stub.game_claim
