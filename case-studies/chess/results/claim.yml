study_id: chess-procedural-wind-tunnel
version: "0.1"
date: "2026-08-24"
outcome: positive

claimed:
  - Chess adapter enforces world-owned board truth via chess.js (observe/move/claim).
  - Gated harness achieves zero illegal executed moves on Track A fixtures.
  - Stale position_hash proposals are rejected without board mutation.
  - Deterministic replay golden logs stable for fixed move sequences.
  - Terminal checkmate claim requires observe evidence and matches world state.
  - Live KIT series (16 games, 641 legal plies) executed zero illegal board mutations; illegal UCI was denied at verify.

not_claimed:
  - LLM strategic strength, Elo, or checkmate rate.
  - Completeness of the 20-game series (stopped at 16; 10 infra + 5 protocol aborts).
  - Python engine parity for chess tools.
  - Engine-bounded candidate selection or Stockfish-at-runtime recommendations.
  - Move-quality metrics (ACPL / blunder rate) — measurement instrument not built.

model:
  id: kit-minimax-plus-mistral
  deployment_hash: case-studies/chess/deployments/kit.yml

population:
  tasks: [start-position]
  conditions: [legality-gated, permissive-control, oriented]
  fixtures: 8
  live_games_completed: 16
  live_games_planned: 20
  live_condition: legality-gated
  repetitions: 1

evaluation_matrix:
  track_a: conformance/fixtures/chess-*
  track_b: live/reports/chess-series/
  stability_report: results/PROCEDURAL-RELIABILITY.md
  series_report: results/SERIES-REPORT.md

hashes:
  adapter: engines/ts/src/adapters/chess.ts
  fixtures_prefix: chess-
  series_summary: live/reports/chess-series/summary.json

independence:
  - Board FEN and legality from chess.js adapter, not model-authored state
  - Terminal status derived from chess.js isGameOver/isCheckmate, not model claim alone
  - Live series traces are observations; they must not be copied into Track A goldens

recorded_vs_live: |
  Track A: eight recorded fixtures prove procedural gates (deterministic replay).
  Track B: KIT two-model series under legality-gated (2026-08-04, 16/20 games).
  Live traces live only under gitignored live/reports/chess-series/.
  Do not treat live aborts (KIT unavailable, empty_proposal) as gate failures.
