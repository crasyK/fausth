spec: counterbalance-contract/v0.1
name: chess-oriented

state:
  fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
  observed: 0
  moves_played: 0
  illegal_attempts: 0
  game_over: 0

limits:
  max_steps: 24
  max_tool_calls: 20
  continue_after_deny: true

tools:
  - id: board.observe
    description: Returns FEN, side, legal_moves (UCI), position_hash, in_check, material. World truth — do not invent moves.
    read_only: true
    input:
      type: object
      additionalProperties: false
      properties: {}
    output:
      type: object
      required: [fen, side, legal_moves, position_hash]
      additionalProperties: true
  - id: board.move
    description: Choose one move from legal_moves returned by board.observe. Pass position_hash to avoid stale-state rejection.
    input:
      type: object
      required: [move, position_hash]
      additionalProperties: false
      properties:
        move: { type: string }
        position_hash: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: true
    verify:
      - kind: absence
        require: { path: result.illegal, eq: 0 }
        otherwise: deny
      - kind: absence
        require: { path: result.stale, eq: 0 }
        otherwise: deny
  - id: game.claim
    description: Claim only after observe on a terminal board.
    input:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: true

gates:
  - id: observe-before-claim
    when: { path: action.name, eq: game.claim }
    require: { path: state.observed, eq: 1 }
    otherwise: deny

counterbalance:
  orientation:
    emit_each_step: true
  sequences:
    - id: observe-before-move
      action: board.move
      require_prior_tools: [board.observe]

permissions:
  tools: [board.observe, board.move, game.claim]
