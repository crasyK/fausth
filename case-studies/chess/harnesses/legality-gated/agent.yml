spec: counterbalance-contract/v0.1
name: chess-legality-gated

state:
  fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
  observed: 0
  moves_played: 0
  illegal_attempts: 0
  game_over: 0

limits:
  max_steps: 24
  max_tool_calls: 20
  continue_after_deny: true

tools:
  - id: board.observe
    description: Read canonical board state, legal UCI moves, and position_hash. Required before move or claim.
    read_only: true
    input:
      type: object
      additionalProperties: false
      properties: {}
    output:
      type: object
      required: [fen, side, legal_moves, position_hash, game_over]
      additionalProperties: true
      properties:
        fen: { type: string }
        side: { type: string }
        legal_moves: { type: array, items: { type: string } }
        position_hash: { type: string }
        in_check: { type: integer }
        game_over: { type: integer }
  - id: board.move
    description: Submit a UCI move (e.g. e2e4). Include position_hash from the latest observe.
    input:
      type: object
      required: [move]
      additionalProperties: false
      properties:
        move: { type: string }
        position_hash: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: integer }
        illegal: { type: integer }
        stale: { type: integer }
        move: { type: string }
        fen: { type: string }
    verify:
      - kind: absence
        require: { path: result.illegal, eq: 0 }
        otherwise: deny
      - kind: absence
        require: { path: result.stale, eq: 0 }
        otherwise: deny
  - id: game.claim
    description: Claim checkmate or draw only after observe on a terminal position.
    input:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [checkmate, draw, stalemate] }
    output:
      type: object
      required: [ok]
      additionalProperties: true
      properties:
        ok: { type: integer }
        kind: { type: string }
        error: { type: string }

gates:
  - id: observe-before-claim
    when: { path: action.name, eq: game.claim }
    require: { path: state.observed, eq: 1 }
    otherwise: deny

counterbalance:
  sequences:
    - id: observe-before-move
      action: board.move
      require_prior_tools: [board.observe]

permissions:
  tools: [board.observe, board.move, game.claim]
