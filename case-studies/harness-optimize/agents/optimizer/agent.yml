spec: counterbalance-contract/v0.1
name: harness-optimizer

# Post-fail optimizer: read digest + current skills, propose or decline a skills-only patch.

state:
  open_todos: 0
  digest_read: 0

mutable: [skills]

limits:
  max_steps: 12
  max_tool_calls: 10
  continue_after_deny: true

tools:
  - id: fs.read
    description: Read optimize/digest.md or agent.yml / skills text under the optimizer worktree
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.list
    description: List files in the optimizer worktree
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, entries, found]
      additionalProperties: true
      properties:
        path: { type: string }
        entries: { type: array, items: { type: string } }
        found: { type: integer }
  - id: harness.reflect_skills
    description: >
      After reading optimize/digest.md: you MUST propose exactly one set_tool_description
      op when the digest shows ANY of these failure signatures:
      (1) verify_evidence_failed with fs.write_scoped but no non-test source path written;
      (2) shell.run_allowlisted called with a cmd other than "test"/"typecheck" (not-allowlisted error);
      (3) stdout containing "Error: unknown tool" (Track T: patch fs.write_scoped with the real tau catalog);
      (4) user.ask loops whose answers are scripted "yes" (Track T: patch user.ask description).
      Map signature -> target tool: (1),(2) -> fs.write_scoped or shell.run_allowlisted;
      (3) -> fs.write_scoped; (4) -> user.ask.
      Decline ONLY if the digest shows a passing cmd="test" (exit_code=0) or an unrelated infra error.
      Never touch permissions/sequences/schemas — descriptions only.
      After reflect_skills, call task.complete.
    input:
      type: object
      required: [disposition]
      additionalProperties: false
      properties:
        disposition: { type: string, enum: [decline, propose] }
        reason:
          type: string
          enum:
            - no_new_heuristic
            - insufficient_evidence
            - would_overfit_task
            - skills_already_adequate
        note: { type: string }
        ops:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [op, tool_id, description]
            additionalProperties: false
            properties:
              op: { type: string, enum: [set_tool_description] }
              tool_id: { type: string }
              description: { type: string }
    output:
      type: object
      required: [ok, disposition]
      additionalProperties: false
      properties:
        ok: { type: integer }
        disposition: { type: string }
        proposed: { type: integer }
        declined: { type: integer }
  - id: task.complete
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - fs.read
    - fs.list
    - harness.reflect_skills
    - task.complete
  filesystem:
    write_scopes: []
    read_scopes: ["."]

counterbalance:
  sequences:
    - id: digest-before-reflect
      action: harness.reflect_skills
      require_prior_tools: [fs.read]
    - id: reflect-before-complete
      action: task.complete
      require_prior_tools: [harness.reflect_skills]
  completion:
    tool: task.complete
    require:
      all:
        - { path: state.open_todos, eq: 0 }
  orientation:
    emit_each_step: true
