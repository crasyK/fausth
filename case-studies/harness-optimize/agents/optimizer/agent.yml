spec: counterbalance-contract/v0.1
name: harness-optimizer

# Post-fail optimizer: read digest + current skills, propose or decline a skills-only patch.

# CASE-8: the old completion gate required open_todos=0 — its initial value, so it never gated
# anything; `digest_read` was never set. Both removed. The evidence-before-reflect sequence is
# structural because the optimizer can read only its evidence (digest + target harness).
state: {}

mutable: [skills]

limits:
  max_steps: 12
  max_tool_calls: 10
  continue_after_deny: true

tools:
  - id: fs.read
    description: Read optimize/digest.md or agent.yml / skills text under the optimizer worktree
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.list
    description: List files in the optimizer worktree
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, entries, found]
      additionalProperties: true
      properties:
        path: { type: string }
        entries: { type: array, items: { type: string } }
        found: { type: integer }
  - id: harness.reflect_skills
    description: >
      After reading optimize/digest.md: propose exactly one set_tool_description op when the
      digest shows a recurring, tool-usage failure signature that a clearer description of an
      existing tool would prevent (e.g. calls of a tool or command that does not exist, arguments
      that repeatedly fail schema validation, a required step the agent keeps skipping);
      otherwise decline with a reason. Never encode task-specific answers (ids, values, file
      names from one task) — the optimizer runs on the dev split only and must generalise.
      Never touch permissions/sequences/schemas — descriptions only.
      After reflect_skills, call task.complete.
    input:
      type: object
      required: [disposition]
      additionalProperties: false
      properties:
        disposition: { type: string, enum: [decline, propose] }
        reason:
          type: string
          enum:
            - no_new_heuristic
            - insufficient_evidence
            - would_overfit_task
            - skills_already_adequate
        note: { type: string }
        ops:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [op, tool_id, description]
            additionalProperties: false
            properties:
              op: { type: string, enum: [set_tool_description] }
              tool_id: { type: string }
              description: { type: string }
    output:
      type: object
      required: [ok, disposition]
      additionalProperties: false
      properties:
        ok: { type: integer }
        disposition: { type: string }
        proposed: { type: integer }
        declined: { type: integer }
  - id: task.complete
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - fs.read
    - fs.list
    - harness.reflect_skills
    - task.complete
  filesystem:
    write_scopes: []
    read_scopes: ["optimize/", "target-agent.yml", "target-agent.json"]

counterbalance:
  sequences:
    - id: read-evidence-before-reflect
      action: harness.reflect_skills
      require_prior_tools: [fs.read]
    - id: reflect-before-complete
      action: task.complete
      require_prior_tools: [harness.reflect_skills]
  completion:
    tool: task.complete
  orientation:
    emit_each_step: true
