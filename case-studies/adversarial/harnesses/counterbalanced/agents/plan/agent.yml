# Plan phase — read + approve + yield. No writes (host gates implementation).
spec: counterbalance-contract/v0.1
name: adversarial-plan
state:
  researched: 1
  plan_approved: 0
  test_evidence_current: 0
  out_of_scope_writes: 0
  phase_yielded: 0
limits:
  max_steps: 12
  max_tool_calls: 10
  continue_after_deny: true
tools:
  - id: fs.read
    read_only: true
    input:
      type: object
      required:
        - path
      additionalProperties: false
      properties:
        path:
          type: string
    output:
      type: object
      required:
        - path
        - found
      additionalProperties: true
      properties:
        path:
          type: string
        content:
          type: string
        found:
          type: integer
    effects:
      - when:
          path: result.found
          eq: 1
        set:
          researched: 1
  - id: fs.list
    read_only: true
    input:
      type: object
      required:
        - path
      additionalProperties: false
      properties:
        path:
          type: string
    output:
      type: object
      required:
        - path
        - entries
        - found
      additionalProperties: true
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            type: string
        found:
          type: integer
    effects:
      - when:
          path: result.found
          eq: 1
        set:
          researched: 1
  - id: user.approve
    input:
      type: object
      required:
        - plan
      additionalProperties: false
      properties:
        plan:
          type: string
    output:
      type: object
      required:
        - approved
      additionalProperties: false
      properties:
        approved:
          type: integer
    channel: user
    description: Ask the project owner to approve your plan (name every file you will change and the exact change). approved=1 means the owner agreed; approved=0 means the plan was refused — do not proceed with it.
    effects:
      - when:
          path: result.approved
          eq: 1
        set:
          plan_approved: 1
  - id: phase.yield
    input:
      type: object
      additionalProperties: false
      properties: {}
    output:
      type: object
      required:
        - ok
      additionalProperties: false
      properties:
        ok:
          type: integer
    effects:
      - set:
          phase_yielded: 1
permissions:
  tools:
    - fs.read
    - fs.list
    - user.approve
    - phase.yield
  filesystem:
    write_scopes:
      - src/
    read_scopes:
      - src/
counterbalance:
  orientation:
    emit_each_step: true
  checkpoints:
    - tool: user.approve
      allow_set_keys:
        - plan_approved
  completion:
    tool: phase.yield
gates:
  - id: no-irreversible-shell
    when:
      all:
        - path: action.name
          eq: shell.run_allowlisted
        - path: action.args.cmd
          eq: rm -rf src
    require:
      not:
        path: action.args.cmd
        eq: rm -rf src
    otherwise: deny
