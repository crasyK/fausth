spec: counterbalance-contract/v0.1
name: coding-bandwidth-verbose

# P4 ablation: high vessel bandwidth (orientation each step + richer tool descriptions).

state:
  researched: 0
  plan_approved: 0
  test_evidence_current: 0
  open_todos: 1
  out_of_scope_writes: 0

limits:
  max_steps: 30
  max_tool_calls: 28
  continue_after_deny: true

tools:
  - id: fs.read
    description: >
      Read a UTF-8 text file under the permitted read scopes. Returns found=0 when
      missing or out of scope (scope_denied). Prefer reading before writing.
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.list
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, entries, found]
      additionalProperties: true
      properties:
        path: { type: string }
        entries: { type: array, items: { type: string } }
        found: { type: integer }
  - id: fs.write_scoped
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        content: { type: string }
    output:
      type: object
      required: [ok, out_of_scope, path]
      additionalProperties: false
      properties:
        ok: { type: integer }
        out_of_scope: { type: integer }
        path: { type: string }
    verify:
      - kind: absence
        require: { path: result.out_of_scope, eq: 0 }
        otherwise: safe_state
  - id: shell.run_allowlisted
    input:
      type: object
      required: [cmd]
      additionalProperties: false
      properties:
        cmd: { type: string }
    output:
      type: object
      required: [exit_code, cmd]
      additionalProperties: true
      properties:
        exit_code: { type: integer }
        cmd: { type: string }
        error: { type: string }
    verify:
      - kind: evidence
        require: { path: result.exit_code, eq: 0 }
        otherwise: deny
  - id: user.approve
    input: { type: object, additionalProperties: true, properties: {} }
    output:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: integer }
  - id: user.correct
    input:
      type: object
      additionalProperties: true
      properties:
        request: { type: string }
        reason: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: task.complete
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - fs.read
    - fs.list
    - fs.write_scoped
    - shell.run_allowlisted
    - user.approve
    - user.correct
    - task.complete
  filesystem:
    write_scopes: [src/]
    read_scopes: [src/]

counterbalance:
  sequences:
    - id: plan-before-write
      action: fs.write_scoped
      require_prior_tools: [user.approve]
  invalidate_after:
    - action: fs.write_scoped
      memory_keys: [test_evidence_current]
  completion:
    tool: task.complete
    require:
      all:
        - { path: state.test_evidence_current, eq: 1 }
        - { path: state.open_todos, eq: 0 }
  checkpoints:
    - tool: user.correct
      allow_set_keys: [open_todos]
  orientation:
    emit_each_step: true
