# KIT KI-Toolbox — institutional OpenAI-compatible gateway.
# Never put API keys in this file. Set KIT_AI_API_KEY in .env.
# Do NOT use standard-external / standard-local aliases.

platform: kit-scc-greenhouse
model:
  transport: openai-compatible
  profile: kit-scc
  base_url: https://ki-toolbox.scc.kit.edu/api/v1
  api_key_env: KIT_AI_API_KEY
  models:
    - kit.glm-5.3-flash
    - kit.deepseek-v4-flash
  temperature: 0
  max_tokens: 1024
  compatibility:
    preserve_response_fields:
      - reasoning_details
    gateway_system_prompt: prohibited

model_catalog:
  - id: kit.glm-5.3-flash
    capabilities: { tools: true, json: true }
    policy: { residency: kit-local, personal_data: allowed, confidential_data: allowed }
  - id: kit.deepseek-v4-flash
    capabilities: { tools: true, json: true }
    policy: { residency: kit-local, personal_data: allowed, confidential_data: allowed }

bindings:
  sensor.temperature.read:
    native: stub.temperature
  sensor.fan.read_percent:
    native: stub.fan_read
  actuator.fan.set:
    native: stub.fan_set
  system.wait:
    native: stub.wait
