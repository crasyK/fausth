platform: ollama-greenhouse
model:
  transport: ollama
  model: llama3.2
  temperature: 0
  max_tokens: 1024
bindings:
  sensor.temperature.read:
    native: stub.temperature
  sensor.fan.read_percent:
    native: stub.fan_read
  actuator.fan.set:
    native: stub.fan_set
  system.wait:
    native: stub.wait
