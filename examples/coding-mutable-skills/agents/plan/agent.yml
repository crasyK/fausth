spec: counterbalance-contract/v0.1
name: coding-plan-mutable

# Plan — no agent reflect tool; host always auto-declines (locked disposition).

state:
  researched: 1
  plan_approved: 0
  test_evidence_current: 0
  open_todos: 1
  out_of_scope_writes: 0
  phase_yielded: 0

mutable: [skills]

limits:
  max_steps: 14
  max_tool_calls: 12
  continue_after_deny: true

tools:
  - id: fs.read
    description: Read a scoped source file
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
    effects:
      - when: { path: result.found, eq: 1 }
        set: { researched: 1 }
  - id: fs.list
    description: List files under a scoped directory
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, entries, found]
      additionalProperties: true
      properties:
        path: { type: string }
        entries: { type: array, items: { type: string } }
        found: { type: integer }
    effects:
      - when: { path: result.found, eq: 1 }
        set: { researched: 1 }
  - id: user.approve
    channel: user
    input: { type: object, additionalProperties: true, properties: {} }
    output:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: integer }
    effects:
      - when: { path: result.approved, eq: 1 }
        set: { plan_approved: 1 }
  - id: user.correct
    channel: user
    input:
      type: object
      additionalProperties: true
      properties:
        request: { type: string }
        reason: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: phase.yield
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
    effects:
      - set: { phase_yielded: 1, researched: 1 }

permissions:
  tools:
    - fs.read
    - fs.list
    - user.approve
    - user.correct
    - phase.yield
  filesystem:
    write_scopes: [src/]
    read_scopes: [src/]

counterbalance:
  checkpoints:
    - tool: user.correct
      allow_set_keys: [open_todos]
    - tool: user.approve
      allow_set_keys: [plan_approved]
  orientation:
    emit_each_step: true
  completion:
    tool: phase.yield

# Harness-declared disposition: hosts render it verbatim as system context (spec-v0.3 §15.3).
instinct_text: "Use only the tools listed for this agent. Prefer tools. Available tools: fs.list, fs.read, phase.yield, user.approve, user.correct. Use only listed tools; never invent tools, shell commands, or mode.enter. This is the plan phase: read as needed, call user.approve with a short plan, then phase.yield. Do not write files or run tests here."
