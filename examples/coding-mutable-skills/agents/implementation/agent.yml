spec: counterbalance-contract/v0.1
name: coding-implementation-mutable

# Implementation + end-of-phase harness.reflect_skills (after tests, before complete).

state:
  researched: 1
  plan_approved: 1
  test_evidence_current: 0
  open_todos: 1
  out_of_scope_writes: 0
  phase_yielded: 0

mutable: [skills]

limits:
  max_steps: 36
  max_tool_calls: 34
  continue_after_deny: true

tools:
  - id: fs.read
    description: Read a scoped source file
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.list
    description: List files under a scoped directory
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, entries, found]
      additionalProperties: true
      properties:
        path: { type: string }
        entries: { type: array, items: { type: string } }
        found: { type: integer }
  - id: fs.write_scoped
    description: Write within scoped paths only
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        content: { type: string }
    output:
      type: object
      required: [ok, out_of_scope, path]
      additionalProperties: false
      properties:
        ok: { type: integer }
        out_of_scope: { type: integer }
        path: { type: string }
    verify:
      - kind: absence
        require: { path: result.out_of_scope, eq: 0 }
        otherwise: safe_state
  - id: shell.run_allowlisted
    description: Run allowlisted shell commands (test)
    input:
      type: object
      required: [cmd]
      additionalProperties: false
      properties:
        cmd: { type: string }
    output:
      type: object
      required: [exit_code, cmd]
      additionalProperties: true
      properties:
        exit_code: { type: integer }
        cmd: { type: string }
        error: { type: string }
    verify:
      - kind: evidence
        require: { path: result.exit_code, eq: 0 }
        otherwise: deny
  - id: user.correct
    input:
      type: object
      additionalProperties: true
      properties:
        request: { type: string }
        reason: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: harness.reflect_skills
    description: >
      After tests pass and todos are clear: end-of-phase skills reflection.
      Prefer disposition=decline with reason skills_already_adequate unless you have one durable
      tool-description heuristic. disposition=propose requires ops=[{op:set_tool_description,tool_id,description}]
      for an existing tool only — never use this to write files, run tests, or plan work.
      Call once, then task.complete.
    input:
      type: object
      required: [disposition]
      additionalProperties: false
      properties:
        disposition: { type: string, enum: [decline, propose] }
        reason:
          type: string
          enum:
            - no_new_heuristic
            - insufficient_evidence
            - would_overfit_task
            - skills_already_adequate
        note: { type: string }
        ops:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [op, tool_id, description]
            additionalProperties: false
            properties:
              op: { type: string, enum: [set_tool_description] }
              tool_id: { type: string }
              description: { type: string }
    output:
      type: object
      required: [ok, disposition]
      additionalProperties: false
      properties:
        ok: { type: integer }
        disposition: { type: string }
        proposed: { type: integer }
        declined: { type: integer }
  - id: task.complete
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - fs.read
    - fs.list
    - fs.write_scoped
    - shell.run_allowlisted
    - user.correct
    - harness.reflect_skills
    - task.complete
  filesystem:
    write_scopes: [src/]
    read_scopes: [src/]

counterbalance:
  sequences:
    - id: work-before-reflect
      action: harness.reflect_skills
      require_prior_tools: [shell.run_allowlisted]
      require_state:
        all:
          - { path: state.test_evidence_current, eq: 1 }
    - id: reflect-before-complete
      action: task.complete
      require_prior_tools: [harness.reflect_skills]
  invalidate_after:
    - action: fs.write_scoped
      memory_keys: [test_evidence_current]
  completion:
    tool: task.complete
    require:
      all:
        - { path: state.test_evidence_current, eq: 1 }
        - { path: state.open_todos, eq: 0 }
  checkpoints:
    - tool: user.correct
      allow_set_keys: [open_todos]
  orientation:
    emit_each_step: true
