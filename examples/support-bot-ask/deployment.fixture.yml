platform: fixture-support-bot-ask
model:
  transport: recorded
bindings:
  kb.lookup:
    native: stub.kb_lookup
  user.ask:
    user:
      source: recorded
      answers: user.answers.jsonl
  answer.send:
    native: stub.answer_send
  human.handoff:
    native: stub.human_handoff
  user.correct:
    user:
      source: recorded
      answers: user.answers.jsonl