name: Submission L1

# HACK//OPS host example — deterministic gate only (no model secrets).
# Copy into the event repo, or call as a starting point and tweak paths/rules.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Submission L1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (untrusted — no secrets in this job)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: crasyK/fausth
          path: fausth
          # Pin to a commit SHA in the host repo
          ref: 0c76a5601d534c5a3fbb90aa550abc4d6901e752

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fausth/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fausth/pnpm-lock.yaml

      - name: Install engine
        working-directory: fausth
        run: pnpm install

      - name: Deterministic review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm -C fausth/engines/ts exec node --import tsx src/cli.ts review \
            --mode deterministic \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out "${GITHUB_WORKSPACE}/review-out.json" \
            --markdown "${GITHUB_WORKSPACE}/review.md" \
            --post 1
          code=$?
          echo "conclusion=$(node -e "console.log(require('${GITHUB_WORKSPACE}/review-out.json').conclusion)")" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-l1
          path: |
            review-out.json
            review.md
