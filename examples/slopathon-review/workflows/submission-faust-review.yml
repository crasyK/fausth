name: Faust advisory review (label-gated)

# Copy into SLOPATHON. Requires secrets.OPENROUTER_API_KEY (or KIT_AI_API_KEY with kit deployment).
# Never checkout/execute contributor workflows as the Faust source while secrets are present.
# Faust code comes from the trusted fausth pin; PR content is fetched as inert API data.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  advisory:
    if: github.event.label.name == 'faust-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crasyK/fausth
          path: fausth
          ref: main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fausth/pnpm-lock.yaml

      - name: Install Faust
        working-directory: fausth
        run: pnpm install

      - name: Advisory review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "conclusion=infrastructure_error" >> "$GITHUB_OUTPUT"
            echo "## Faust advisory" > "${GITHUB_WORKSPACE}/review.md"
            echo "OPENROUTER_API_KEY missing — conclusion \`infrastructure_error\` (not a pass)." >> "${GITHUB_WORKSPACE}/review.md"
            echo '{"conclusion":"infrastructure_error","mode":"advisory","ai_findings":[],"markdown":"## Faust advisory\n\n**Conclusion:** `infrastructure_error`\n"}' > "${GITHUB_WORKSPACE}/review-out.json"
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "${GITHUB_WORKSPACE}/review.md"
            exit 0
          fi
          pnpm -C fausth/engines/ts exec node --import tsx src/cli.ts review \
            --mode advisory \
            --deployment "${GITHUB_WORKSPACE}/fausth/examples/slopathon-review/deployment.openrouter.yml" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out "${GITHUB_WORKSPACE}/review-out.json" \
            --markdown "${GITHUB_WORKSPACE}/review.md" \
            --post 1
          echo "conclusion=$(node -e "console.log(require('${GITHUB_WORKSPACE}/review-out.json').conclusion)")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: faust-advisory
          path: |
            review-out.json
            review.md
