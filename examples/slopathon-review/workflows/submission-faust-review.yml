name: Submission L2

# HACK//OPS host example — label-gated advisory (secrets only here).
# Engine comes from a trusted pin; PR content is fetched as inert API data.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Submission L2
    if: github.event.label.name == 'faust-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crasyK/fausth
          path: fausth
          ref: 022d590e9e1739d19858d4f1bdb9305c8ca5ce7a

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fausth/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fausth/pnpm-lock.yaml

      - name: Install engine
        working-directory: fausth
        run: pnpm install

      - name: Advisory review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIT_AI_API_KEY: ${{ secrets.KIT_AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${KIT_AI_API_KEY:-${OPENROUTER_API_KEY:-}}" ]; then
            echo "conclusion=infrastructure_error" >> "$GITHUB_OUTPUT"
            echo "## Submission review · Layer 2 · advisory" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| | |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Result** | 🔧 infrastructure error (not a pass) |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "API key missing — advisory did not run." >> "$GITHUB_STEP_SUMMARY"
            echo '{"conclusion":"infrastructure_error","mode":"advisory","ai_findings":[]}' > "${GITHUB_WORKSPACE}/review-out.json"
            exit 1
          fi
          DEPLOY="${GITHUB_WORKSPACE}/fausth/examples/slopathon-review/deployment.kit.yml"
          if [ -z "${KIT_AI_API_KEY:-}" ]; then
            DEPLOY="${GITHUB_WORKSPACE}/fausth/examples/slopathon-review/deployment.openrouter.yml"
          fi
          pnpm -C fausth/engines/ts exec node --import tsx src/cli.ts review \
            --mode advisory \
            --deployment "$DEPLOY" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out "${GITHUB_WORKSPACE}/review-out.json" \
            --markdown "${GITHUB_WORKSPACE}/review.md" \
            --post 1
          echo "conclusion=$(node -e "console.log(require('${GITHUB_WORKSPACE}/review-out.json').conclusion)")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-l2
          path: |
            review-out.json
            review.md
