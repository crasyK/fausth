platform: slopathon-openrouter
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - nvidia/nemotron-3-super-120b-a12b:free
  temperature: 0
  max_tokens: 1024
bindings:
  packet.summary.read:
    native: review.packet_summary
  repository.file.read:
    native: review.file_read
  finding.submit:
    native: review.finding_submit
