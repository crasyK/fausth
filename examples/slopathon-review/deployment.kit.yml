platform: slopathon-kit
model:
  transport: openai-compatible
  profile: kit-scc
  base_url: https://ki-toolbox.scc.kit.edu/api/v1
  api_key_env: KIT_AI_API_KEY
  models:
    - kit.glm-5.3-flash
    - kit.deepseek-v4-flash
  temperature: 0
  max_tokens: 1024
# KIT-hosted local models (D15, 2026-10-13); the older kit.* ids are retired.
model_catalog:
  - id: kit.glm-5.3-flash
    policy: { residency: kit-local, personal_data: allowed }
  - id: kit.deepseek-v4-flash
    policy: { residency: kit-local, personal_data: allowed }
data_policy:
  classification: personal
  require:
    residency: kit-local
bindings:
  packet.summary.read:
    native: review.packet_summary
  repository.file.read:
    native: review.file_read
  finding.submit:
    native: review.finding_submit
