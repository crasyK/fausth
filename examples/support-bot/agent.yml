spec: counterbalance-contract/v0.1
name: support-bot-counterbalance

state:
  kb_cited: 0
  handoff: 0

limits:
  max_steps: 12
  max_tool_calls: 10

tools:
  - id: kb.lookup
    read_only: true
    input:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string }
    output:
      type: object
      required: [ok, article_id]
      additionalProperties: true
      properties:
        ok: { type: integer }
        article_id: { type: string }
    effects:
      - when: { path: result.ok, eq: 1 }
        set: { kb_cited: 1 }
  - id: answer.send
    input:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: human.handoff
    input:
      type: object
      additionalProperties: true
      properties:
        reason: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
    effects:
      - when: { path: result.ok, eq: 1 }
        set: { handoff: 1 }
  - id: user.correct
    channel: user
    input: { type: object, additionalProperties: true, properties: { set: { type: object } } }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: refund.request
    input:
      type: object
      additionalProperties: true
      properties: {}
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - kb.lookup
    - answer.send
    - human.handoff
    - user.correct
    # refund.request intentionally omitted — billing mutation denied

counterbalance:
  sequences:
    - id: kb-before-answer
      action: answer.send
      require_prior_tools: [kb.lookup]
  invalidate_after: []
  completion:
    tool: answer.send
    require:
      path: state.kb_cited
      eq: 1

# Harness-declared disposition: hosts render it verbatim as system context (spec-v0.3 §15.3).
instinct_text: "Use only the tools listed for this agent. Prefer tools. Available tools: answer.send, human.handoff, kb.lookup, refund.request, user.correct. Use only listed tools; never invent tools, shell commands, or mode.enter."
