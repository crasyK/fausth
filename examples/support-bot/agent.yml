spec: counterbalance-contract/v0.1
name: support-bot-counterbalance

state:
  kb_cited: 0
  handoff: 0

limits:
  max_steps: 12
  max_tool_calls: 10

tools:
  - id: kb.lookup
    read_only: true
    input:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string }
    output:
      type: object
      required: [ok, article_id]
      additionalProperties: true
      properties:
        ok: { type: integer }
        article_id: { type: string }
  - id: answer.send
    input:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: human.handoff
    input:
      type: object
      additionalProperties: true
      properties:
        reason: { type: string }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: user.correct
    input: { type: object, additionalProperties: true, properties: { set: { type: object } } }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: refund.request
    input:
      type: object
      additionalProperties: true
      properties: {}
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - kb.lookup
    - answer.send
    - human.handoff
    - user.correct
    # refund.request intentionally omitted — billing mutation denied

counterbalance:
  sequences:
    - id: kb-before-answer
      action: answer.send
      require_prior_tools: [kb.lookup]
  invalidate_after: []
  completion:
    tool: answer.send
    require:
      path: state.kb_cited
      eq: 1
