platform: openrouter-support-bot
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - cohere/north-mini-code:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - google/gemma-4-26b-a4b-it:free
  temperature: 0
  max_tokens: 1024
bindings:
  kb.lookup:
    native: stub.kb_lookup
  answer.send:
    native: stub.answer_send
  human.handoff:
    native: stub.human_handoff
  user.correct:
    native: stub.user_correct
  refund.request:
    native: stub.refund_request
