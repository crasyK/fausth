# Live OpenRouter model + live MCP stdio (toy weather server).
# Requires: OPENROUTER_API_KEY in .env (never put secrets here).
platform: openrouter-mcp-connectors
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - cohere/north-mini-code:free
    - google/gemma-4-26b-a4b-it:free
  temperature: 0
  max_tokens: 512
bindings:
  sensor.fan.read_percent:
    native: stub.fan_read
  get_forecast:
    native: mcp.weather.get_forecast
mcp:
  weather:
    transport: stdio
    command: node
    args: [servers/weather-stdio.mjs]
    timeout_ms: 15000
