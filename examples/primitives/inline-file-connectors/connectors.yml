format: fausth-connectors/v0.1
connectors:
  - id: temperature
    kind: inline
    provides:
      - id: sensor.temperature.read
        read_only: true
        description: Connector-provided temperature sensor
        input:
          type: object
          additionalProperties: false
          properties: {}
        output:
          type: object
          required: [celsius_decidegrees]
          additionalProperties: false
          properties:
            celsius_decidegrees: { type: integer }
    select: [sensor.temperature.read]
  - id: wait
    kind: file
    path: connectors/wait.yml
    select: [system.wait]
