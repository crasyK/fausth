platform: ollama-coding
model:
  transport: openai-compatible
  profile: ollama
  base_url: http://127.0.0.1:11434/v1
  api_key_env: OLLAMA_API_KEY
  models:
    - llama3.2
  temperature: 0
  max_tokens: 1024
bindings:
  fs.read:
    native: stub.fs_read
  fs.list:
    native: stub.fs_list
  fs.write_scoped:
    native: stub.fs_write
  shell.run_allowlisted:
    native: stub.shell
  user.approve:
    native: stub.approve
  agent.spawn:
    native: stub.spawn
