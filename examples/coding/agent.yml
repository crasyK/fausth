spec: counterbalance-contract/v0.1
name: coding-micro-harness

state:
  out_of_scope_writes: 0

limits:
  max_steps: 6
  max_tool_calls: 4

fallback_state:
  out_of_scope_writes: 0

tools:
  - id: fs.read
    description: Read a file
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.write_scoped
    description: Write only within declared scopes
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        content: { type: string }
    output:
      type: object
      required: [ok, out_of_scope, path]
      additionalProperties: false
      properties:
        ok: { type: integer }
        out_of_scope: { type: integer }
        path: { type: string }
    verify:
      - kind: absence
        require:
          path: result.out_of_scope
          eq: 0
        otherwise: safe_state
  - id: shell.run_allowlisted
    description: Run allowlisted commands (test, typecheck)
    input:
      type: object
      required: [cmd]
      additionalProperties: false
      properties:
        cmd: { type: string }
    output:
      type: object
      required: [exit_code, cmd]
      additionalProperties: true
      properties:
        exit_code: { type: integer }
        cmd: { type: string }
        error: { type: string }
    verify:
      - kind: evidence
        require:
          path: result.exit_code
          eq: 0
        otherwise: deny
  - id: user.approve
    description: Ask user for approval
    input:
      type: object
      additionalProperties: true
      properties: {}
    output:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: integer }
  - id: agent.spawn
    description: Spawn a child agent (tighten-only)
    input:
      type: object
      required: [tools]
      additionalProperties: true
      properties:
        tools:
          type: array
          items: { type: string }
        filesystem: { type: object }
        limits: { type: object }
    output:
      type: object
      required: [spawned, tools]
      additionalProperties: false
      properties:
        spawned: { type: integer }
        tools:
          type: array
          items: { type: string }

gates:
  - id: write-must-have-path
    when:
      path: action.name
      eq: fs.write_scoped
    require:
      path: action.args.path
      neq: ""
    otherwise: deny

permissions:
  tools:
    - fs.read
    - fs.write_scoped
    - shell.run_allowlisted
    - user.approve
    - agent.spawn
  filesystem:
    write_scopes:
      - src/
      - tests/
    read_scopes:
      - src/
      - tests/

spawn:
  allow: true
  tighten_only: true
  allow_nested: false
