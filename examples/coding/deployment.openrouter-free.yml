platform: openrouter-coding
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - cohere/north-mini-code:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - google/gemma-4-26b-a4b-it:free
  temperature: 0
  max_tokens: 1024
  judge_model: google/gemma-4-26b-a4b-it:free
bindings:
  fs.read:
    native: stub.fs_read
  fs.list:
    native: stub.fs_list
  fs.write_scoped:
    native: stub.fs_write
  shell.run_allowlisted:
    native: stub.shell
  user.approve:
    native: stub.approve
  agent.spawn:
    native: stub.spawn
