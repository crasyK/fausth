platform: simulation-coding-counterbalance
model:
  transport: recorded
bindings:
  fs.read:
    native: sim.fs_read
  fs.list:
    native: sim.fs_list
  fs.write_scoped:
    native: sim.fs_write
  shell.run_allowlisted:
    native: sim.shell
  user.approve:
    native: sim.approve
  user.correct:
    native: sim.user_correct
  task.complete:
    native: sim.task_complete
