# Explicit-only local coding deployment (OpenRouter free).
# Never selected by `fausth test`, replay, or default deployment discovery.
# Requires: --workspace <linked disposable git worktree> and OPENROUTER_API_KEY.

platform: openrouter-coding-counterbalance-local
model:
  transport: openai-compatible
  profile: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  models:
    - openrouter/free
  temperature: 0
  max_tokens: 2048

world:
  shell_timeout_ms: 60000
  max_read_bytes: 256000
  max_output_bytes: 64000
  commands:
    test: ["node", "--test"]
  scopes:
    read: [src/]
    write: [src/]

bindings:
  fs.read:
    native: local.fs_read
  fs.write_scoped:
    native: local.fs_write
  shell.run_allowlisted:
    native: local.shell
  user.approve:
    native: local.user_approve
  user.correct:
    native: local.user_correct
  mode.enter:
    native: local.mode_enter
  task.complete:
    native: local.task_complete
