# Generic OpenAI-compatible Chat Completions (api.openai.com or compatible proxy).
# Never put API keys in this file. Set OPENAI_API_KEY in .env.

platform: openai-coding-counterbalance
model:
  transport: openai-compatible
  profile: generic
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  models:
    - gpt-4.1-mini
    - gpt-4o-mini
  temperature: 0
  max_tokens: 1024
  judge_model: gpt-4o-mini

bindings:
  fs.read:
    native: stub.fs_read
  fs.list:
    native: stub.fs_list
  fs.write_scoped:
    native: stub.fs_write
  shell.run_allowlisted:
    native: stub.shell
  user.approve:
    native: stub.approve
  user.correct:
    native: stub.user_correct
  task.complete:
    native: stub.task_complete
