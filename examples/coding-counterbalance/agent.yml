spec: counterbalance-contract/v0.1
name: coding-counterbalance-slice

state:
  mode: research
  researched: 0
  plan_approved: 0
  test_evidence_current: 0
  open_todos: 1
  out_of_scope_writes: 0

limits:
  max_steps: 20
  max_tool_calls: 16

tools:
  - id: fs.read
    read_only: true
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
    output:
      type: object
      required: [path, found]
      additionalProperties: true
      properties:
        path: { type: string }
        content: { type: string }
        found: { type: integer }
  - id: fs.write_scoped
    input:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string }
        content: { type: string }
    output:
      type: object
      required: [ok, out_of_scope, path]
      additionalProperties: false
      properties:
        ok: { type: integer }
        out_of_scope: { type: integer }
        path: { type: string }
    verify:
      - kind: absence
        require: { path: result.out_of_scope, eq: 0 }
        otherwise: safe_state
  - id: shell.run_allowlisted
    input:
      type: object
      required: [cmd]
      additionalProperties: false
      properties:
        cmd: { type: string }
    output:
      type: object
      required: [exit_code, cmd]
      additionalProperties: true
      properties:
        exit_code: { type: integer }
        cmd: { type: string }
        error: { type: string }
    verify:
      - kind: evidence
        require: { path: result.exit_code, eq: 0 }
        otherwise: deny
  - id: user.approve
    input: { type: object, additionalProperties: true, properties: {} }
    output:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: integer }
  - id: user.correct
    input: { type: object, additionalProperties: true, properties: { set: { type: object } } }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }
  - id: mode.enter
    input:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string }
    output:
      type: object
      required: [ok, mode]
      additionalProperties: false
      properties:
        ok: { type: integer }
        mode: { type: string }
  - id: task.complete
    input: { type: object, additionalProperties: false, properties: {} }
    output:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: integer }

permissions:
  tools:
    - fs.read
    - fs.write_scoped
    - shell.run_allowlisted
    - user.approve
    - user.correct
    - mode.enter
    - task.complete
  filesystem:
    write_scopes: [src/]
    read_scopes: [src/]

counterbalance:
  modes:
    - id: research
      tools: [fs.read, mode.enter, user.correct]
    - id: plan
      tools: [fs.read, user.approve, mode.enter, user.correct]
    - id: implementation
      tools:
        - fs.read
        - fs.write_scoped
        - shell.run_allowlisted
        - mode.enter
        - task.complete
        - user.correct
  sequences:
    - id: plan-before-write
      action: fs.write_scoped
      require_prior_tools: [user.approve]
  invalidate_after:
    - action: fs.write_scoped
      memory_keys: [test_evidence_current]
  completion:
    tool: task.complete
    require:
      all:
        - { path: state.test_evidence_current, eq: 1 }
        - { path: state.open_todos, eq: 0 }
