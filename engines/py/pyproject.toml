[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fausth"
version = "0.1.1"
description = "Faust Harness Python twin — Counterbalance Contract replay engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fausth-py = "fausth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fausth*"]
