[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fausth"
version = "0.5.5"
description = "Faust Harness — Python engine (spec v0.5)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "chess>=1.10"]
chess = ["chess>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fausth*"]

[tool.setuptools.package-data]
# A copy of /schema/harness.v0.5.json; tests/test_harness.py fails if it drifts.
fausth = ["harness.v0.5.json"]
