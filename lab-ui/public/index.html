<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fausth Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand-block">
        <p class="brand">Fausth Lab</p>
        <p class="lede">Run approved worlds on the CasaOS vessel. Cursor on the host stays the engine desk.</p>
      </header>

      <section class="panel" aria-labelledby="worlds-heading">
        <h1 id="worlds-heading">Worlds</h1>
        <p class="hint">Pick a catalog entry, then start Track A or a recorded case-study.</p>
        <div id="world-list" class="world-list"></div>
        <div class="actions">
          <button type="button" id="btn-conformance" class="btn secondary">Repo conformance</button>
        </div>
      </section>

      <section class="panel log-panel" aria-labelledby="log-heading">
        <h1 id="log-heading">Run log</h1>
        <p id="run-meta" class="hint">No active run.</p>
        <pre id="log" class="log" tabindex="0"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
