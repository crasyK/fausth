name: multi-host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coding-counterbalance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pip install -e "engines/py[dev]"
      - name: Multi-host smoke (TS ≡ Python ≡ golden)
        run: node scripts/multi-host-smoke.mjs
