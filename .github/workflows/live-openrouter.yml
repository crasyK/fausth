name: live-openrouter
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - name: Run live suite
        id: live
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY — skipping live suite"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --scenarios ../../live/scenarios \
            --report ../../live/reports/nightly.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited / catalog empty — skipping fail"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - name: Live coding-counterbalance (OpenRouter)
        id: live_cb_or
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY — skipping CB OpenRouter live"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --deployment ../../examples/coding-counterbalance/deployment.openrouter-free.yml \
            --scenarios ../../live/scenarios-coding-counterbalance \
            --report ../../live/reports/coding-counterbalance-openrouter.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit $code
      - name: Live coding-counterbalance (KIT)
        id: live_cb_kit
        env:
          KIT_AI_API_KEY: ${{ secrets.KIT_AI_API_KEY }}
        run: |
          if [ -z "$KIT_AI_API_KEY" ]; then
            echo "No KIT_AI_API_KEY — skipping CB KIT live"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --deployment ../../examples/coding-counterbalance/deployment.kit.yml \
            --scenarios ../../live/scenarios-coding-counterbalance \
            --report ../../live/reports/coding-counterbalance-kit.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit $code
      - name: Live coding-counterbalance (OpenAI)
        id: live_cb_openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY — skipping CB OpenAI live"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --deployment ../../examples/coding-counterbalance/deployment.openai.yml \
            --scenarios ../../live/scenarios-coding-counterbalance \
            --report ../../live/reports/coding-counterbalance-openai.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit $code
      - name: Live support-bot (OpenRouter)
        id: live_support_or
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY — skipping support OpenRouter live"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --deployment ../../examples/support-bot/deployment.openrouter-free.yml \
            --scenarios ../../live/scenarios-support-bot \
            --report ../../live/reports/support-bot-openrouter.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit $code
      - name: Live support-bot (KIT)
        id: live_support_kit
        env:
          KIT_AI_API_KEY: ${{ secrets.KIT_AI_API_KEY }}
        run: |
          if [ -z "$KIT_AI_API_KEY" ]; then
            echo "No KIT_AI_API_KEY — skipping support KIT live"
            exit 0
          fi
          mkdir -p live/reports
          set +e
          pnpm -C engines/ts exec node --import tsx src/cli.ts live \
            --deployment ../../examples/support-bot/deployment.kit.yml \
            --scenarios ../../live/scenarios-support-bot \
            --report ../../live/reports/support-bot-kit.json \
            --catch-rate-min 0.5
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit $code
      - name: Live local coding e2e (OpenRouter disposable worktree)
        id: live_local_e2e_or
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY — skipping live local e2e"
            exit 0
          fi
          set +e
          node scripts/live-local-e2e.mjs local-openrouter
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          # Non-blocking soft fail for model flakiness: upload report regardless
          exit 0
      - name: Live local coding e2e (KIT disposable worktree)
        id: live_local_e2e_kit
        env:
          KIT_AI_API_KEY: ${{ secrets.KIT_AI_API_KEY }}
        run: |
          if [ -z "$KIT_AI_API_KEY" ]; then
            echo "No KIT_AI_API_KEY — skipping live local e2e"
            exit 0
          fi
          set +e
          node scripts/live-local-e2e.mjs local-kit
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Rate limited — skipping fail"
            exit 0
          fi
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-report
          path: live/reports/
          if-no-files-found: ignore
