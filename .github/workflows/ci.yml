name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reduced to what exists while the spec v0.4 engines are being built (docs/build-plan-v0.4.md).

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C engines/ts typecheck

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "engines/py[dev]"
      - run: python -c "import fausth"
