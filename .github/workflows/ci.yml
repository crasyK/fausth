name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C engines/ts test
      - run: pnpm -C engines/ts exec node --import tsx src/cli.ts replay
      - name: Local disposable-worktree e2e (recorded)
        run: node scripts/local-e2e.mjs
      - name: Bundle round-trip
        run: |
          pip install -e "engines/py"
          node scripts/bundle-roundtrip.mjs
      - name: Resolved connector execution parity
        run: pnpm ci:resolve

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "engines/py[dev]"
      - run: pytest engines/py/tests -q
      - run: fausth-py replay

  parity:
    needs: [ts, py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pip install -e "engines/py[dev]"
      - run: node scripts/parity.mjs

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pip install -e "engines/py[dev]"
      - run: pnpm ci:packaging
      - run: python -m fausth test examples/coding-counterbalance
      - run: python -m fausth test examples/support-bot
      - run: python -m fausth pack examples/coding-counterbalance --out live/reports/coding-counterbalance-py.fausth.json
