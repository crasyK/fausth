name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The three engines, the browser host, and the conformance set they must reproduce (docs/spec-v0.6.md §14).

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C engines/ts typecheck
      - run: pnpm -C engines/ts test

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "engines/py[dev]"
      - run: pytest engines/py/tests -q

  rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/rs
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Replay every fixture with the command-line tool
        run: cargo run --locked -- replay ../../conformance/fixtures/*/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C hosts/web typecheck
      - run: pnpm -C hosts/web test
      - run: pnpm -C hosts/web build
      - name: Replay every fixture in headless Chrome
        run: pnpm -C hosts/web check
