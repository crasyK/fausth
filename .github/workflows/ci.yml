name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both engines, the browser host, and the conformance set they must reproduce (docs/spec-v0.5.md §14).

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C engines/ts typecheck
      - run: pnpm -C engines/ts test

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "engines/py[dev]"
      - run: pytest engines/py/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm -C hosts/web typecheck
      - run: pnpm -C hosts/web test
      - run: pnpm -C hosts/web build
      - name: Replay every fixture in headless Chrome
        run: pnpm -C hosts/web check
